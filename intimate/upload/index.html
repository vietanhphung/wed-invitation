<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="robots" content="noindex, nofollow">
<!-- Upload page behind the QR code at the venue. Only our own scripts; uploads go to AWS directly. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.cloudfront.net; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com https://*.cloudfront.net; form-action 'self'; base-uri 'self'; object-src 'none'">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png?v=2">
<title>Gửi ảnh | Việt Anh &amp; Hương Giang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=20261125184857">
<link rel="stylesheet" href="../gallery/gallery.css?v=20261125184857">
</head>
<body>
<header class="g-top">
  <a class="g-mark" href="../">A <i>&amp;</i> G</a>
  <a class="text-link" href="../gallery/">Xem album</a>
</header>

<main class="g-main g-upload-page">
  <div class="section-head">
    <p class="kicker"><i></i>Tiệc cưới thân mật<i></i></p>
    <h1 class="title">Gửi <em>ảnh</em></h1>
    <p class="g-intro">Những khoảnh khắc bạn ghi lại là món quà quý của chúng mình. Hãy gửi ảnh vào đây để mọi người cùng xem nhé.</p>
  </div>

  <!-- Carousel: newest guest photos; the couple's photos until the first upload arrives -->
  <section class="g-carousel" id="carousel" aria-roledescription="carousel" aria-label="Ảnh mới trong album"
    data-fallback="../../assets/photos/gallery-7.webp ../../assets/photos/gallery-8.webp ../../assets/photos/gallery-9.webp ../../assets/photos/gallery-12.webp ../../assets/photos/gallery-14.webp ../../assets/photos/gallery-5.webp ../../assets/photos/gallery-16.webp">
    <ul class="g-track" id="carousel-track"></ul>
    <div class="g-dots" id="carousel-dots" aria-hidden="true"></div>
  </section>

  <div class="g-upload" id="upload-box">
    <label class="btn solid g-pick">
      <input type="file" id="file-input" accept="image/*" multiple hidden>
      Chọn ảnh để gửi
    </label>
    <p class="g-hint">Chọn một hoặc nhiều ảnh · tối đa <span id="max-mb">30</span> MB mỗi ảnh</p>
    <p class="g-status" id="upload-status" role="status" aria-live="polite"></p>
    <a class="text-link" id="after-upload" href="../gallery/" hidden>Xem album</a>
  </div>

  <p class="g-note" id="notice" hidden></p>
</main>

<script src="../gallery/config.js?v=20261125184857"></script>
<script type="module" src="../gallery/main.js?v=20261125184857"></script>
</body>
</html>
