<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="robots" content="noindex">
<!-- Only our own scripts; photos/uploads talk to AWS (Cognito, S3, CloudFront) directly. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.cloudfront.net; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com https://*.cloudfront.net; form-action 'self'; base-uri 'self'; object-src 'none'">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png?v=2">
<title>Album chung | Việt Anh &amp; Hương Giang</title>
<meta name="description" content="Cùng chia sẻ những khoảnh khắc trong tiệc cưới của Việt Anh &amp; Hương Giang.">
<meta property="og:type" content="website">
<meta property="og:title" content="Album chung · Việt Anh &amp; Hương Giang">
<meta property="og:description" content="Gửi những bức ảnh bạn chụp trong ngày vui của chúng mình.">
<meta property="og:image" content="https://vietanhphung.com/wed-invitation/assets/photos/share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=20261125183110">
<link rel="stylesheet" href="gallery.css?v=20261125183110">
</head>
<body>
<header class="g-top">
  <a class="g-mark" href="../">A <i>&amp;</i> G</a>
  <a class="text-link" href="../">Thiệp mời</a>
</header>

<main class="g-main">
  <div class="section-head">
    <p class="kicker"><i></i>Tiệc cưới thân mật<i></i></p>
    <h1 class="title">Album <em>chung</em></h1>
    <p class="g-intro">Những khoảnh khắc bạn ghi lại là món quà quý của chúng mình. Hãy gửi ảnh vào đây để mọi người cùng xem nhé.</p>
  </div>

  <div class="g-upload" id="upload-box">
    <label class="btn solid g-pick">
      <input type="file" id="file-input" accept="image/*" multiple hidden>
      Gửi ảnh
    </label>
    <p class="g-hint">Chọn một hoặc nhiều ảnh · tối đa <span id="max-mb">30</span> MB mỗi ảnh</p>
    <p class="g-status" id="upload-status" role="status" aria-live="polite"></p>
  </div>

  <p class="g-note" id="notice" hidden></p>

  <div class="g-admin-bar" id="admin-bar" hidden>
    <span>Đang quản lý album</span>
    <button class="text-link g-linkbtn" type="button" id="logout-btn">Đăng xuất</button>
  </div>

  <p class="g-empty" id="empty" hidden>Chưa có ảnh nào — bạn hãy là người đầu tiên nhé!</p>
  <ul class="g-grid" id="grid" aria-label="Ảnh trong album"></ul>
</main>

<footer class="g-foot">
  <button class="g-admin-link" type="button" id="login-btn">Quản trị</button>
</footer>

<dialog class="g-lightbox" id="lightbox" aria-label="Xem ảnh">
  <img id="lb-img" alt="">
  <button class="g-lb-btn g-lb-close" type="button" id="lb-close" aria-label="Đóng">×</button>
  <button class="g-lb-btn g-lb-prev" type="button" id="lb-prev" aria-label="Ảnh trước">‹</button>
  <button class="g-lb-btn g-lb-next" type="button" id="lb-next" aria-label="Ảnh sau">›</button>
</dialog>

<script src="config.js?v=20261125183110"></script>
<script type="module" src="main.js?v=20261125183110"></script>
</body>
</html>
