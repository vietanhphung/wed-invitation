<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 220 320">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3364a"/><stop offset=".5" stop-color="#6b1526"/><stop offset="1" stop-color="#3e0913"/>
    </linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/><stop offset=".55" stop-color="#f1ead9"/><stop offset="1" stop-color="#cdbf9f"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6b3a"/><stop offset="1" stop-color="#86a466"/>
    </linearGradient>
    <!-- one calla bloom, base at (0,0), opening up and to the left -->
    <symbol id="wine" overflow="visible">
      <path d="M0 0C-10-8-22-26-22-48C-22-70-6-88 14-96C10-84 12-70 20-58C30-42 28-18 0 0Z" fill="url(#gw)"/>
      <path d="M2-10C12-24 18-42 16-60C10-74 2-82-4-84C-14-74-16-56-10-40C-6-28-2-18 2-10Z" fill="#470b17" opacity=".75"/>
      <path d="M14-96C8-84 10-70 18-58" fill="none" stroke="#c4566a" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      <path d="M2-14C4-26 6-38 4-50" fill="none" stroke="#e2b552" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="cream" overflow="visible">
      <path d="M0 0C-10-8-22-26-22-48C-22-70-6-88 14-96C10-84 12-70 20-58C30-42 28-18 0 0Z" fill="url(#gc)" stroke="#bfb08e" stroke-width=".8"/>
      <path d="M2-10C12-24 18-42 16-60C10-74 2-82-4-84C-14-74-16-56-10-40C-6-28-2-18 2-10Z" fill="#e4d8bb" opacity=".8"/>
      <path d="M14-96C8-84 10-70 18-58" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M2-14C4-26 6-38 4-50" fill="none" stroke="#e2b552" stroke-width="4" stroke-linecap="round"/>
      <path d="M-1 0C-2 4-2 8-1 12" fill="none" stroke="#9db27a" stroke-width="5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- leaves -->
  <path d="M112 300C80 262 44 232 16 204C52 214 88 246 112 300Z" fill="url(#gl)"/>
  <path d="M112 300C78 258 46 228 18 205" fill="none" stroke="#3f5a2e" stroke-width=".8" opacity=".6"/>
  <path d="M112 300C142 262 176 238 204 216C170 222 136 252 112 300Z" fill="#5c7b44"/>
  <path d="M112 300C100 250 98 214 104 176C116 214 118 256 112 300Z" fill="#6f8f52" opacity=".9"/>

  <!-- stems -->
  <g fill="none" stroke="#5f7d45" stroke-width="3.2" stroke-linecap="round">
    <path d="M78 150Q92 230 112 300"/>
    <path d="M112 120Q108 220 112 300"/>
    <path d="M146 150Q128 232 112 300"/>
    <path d="M92 185Q100 250 112 300"/>
    <path d="M132 190Q120 250 112 300"/>
  </g>

  <!-- ribbon -->
  <path d="M100 262Q112 268 126 260L128 270Q113 278 99 272Z" fill="#f4efe2" stroke="#d8ccb0" stroke-width=".8"/>
  <path d="M112 270C104 284 98 294 92 306M114 270C120 286 126 296 132 306" fill="none" stroke="#f4efe2" stroke-width="3" stroke-linecap="round"/>

  <!-- blooms -->
  <use href="#wine"  xlink:href="#wine"  transform="translate(78 150) rotate(-24) scale(1.05)"/>
  <use href="#cream" xlink:href="#cream" transform="translate(112 120) rotate(-4)"/>
  <use href="#wine"  xlink:href="#wine"  transform="translate(146 150) rotate(26) scale(.95) scale(-1 1)"/>
  <use href="#cream" xlink:href="#cream" transform="translate(92 185) rotate(-12) scale(.85)"/>
  <use href="#wine"  xlink:href="#wine"  transform="translate(132 190) rotate(16) scale(.75) scale(-1 1)"/>
</svg>
